# Alembic configuration for RecruitRadar's SQLite database.
# Run from backend/:  ..\.venv\Scripts\python.exe -m alembic upgrade head
# The database path comes from RECRUIT_RADAR_DB_PATH (default backend/data/recruit_radar.sqlite3).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
